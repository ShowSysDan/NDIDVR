[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ndi-recorder"
version = "0.1.0"
description = "Multi-source NDI recorder with Flask dashboard and S3 storage"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in argument defaults (Flask routes)
    "UP007", # Use X | Y for type annotations (keep | for 3.10 compat)
]
exclude = ["migrations/", "venv/", ".venv/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["F811"]  # allow fixture redefinition

[tool.ruff.isort]
known-first-party = ["app", "config"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}NDI Recorder{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme (WebRetriever2 palette) ─────────────────────────────────────── */
    :root {
      --bg:           #0a0b0f;
      --surface:      #12141a;
      --surface2:     #1a1d26;
      --border:       #2a2d38;
      --border-hover: #3a3d48;
      --text:         #e4e6ed;
      --text-dim:     #8b8fa3;
      --accent:       #22c55e;
      --accent-dim:   #166534;
      --danger:       #ef4444;
      --danger-dim:   #7f1d1d;
      --warning:      #f59e0b;
      --blue:         #3b82f6;
      --radius:       8px;
      --nav-h:        56px;

      /* Back-compat aliases so existing templates keep working */
      --accent2:      var(--accent);
      --warn:         var(--warning);
      --muted:        var(--text-dim);
    }

    body { background: var(--bg); color: var(--text);
           font-family: 'Outfit', system-ui, sans-serif;
           font-weight: 400; font-size: 14px; min-height: 100vh;
           -webkit-font-smoothing: antialiased; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 24px; gap: 32px; z-index: 100;
    }
    .nav-brand { font-weight: 700; font-size: 15px; color: var(--text); text-decoration: none;
                 display: flex; align-items: center; gap: 10px;
                 letter-spacing: .02em; text-transform: uppercase; }
    .nav-brand::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
                         background: var(--danger); box-shadow: 0 0 8px var(--danger);
                         animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    nav a { color: var(--text-dim); text-decoration: none; padding: 6px 0;
            font-size: 13px; font-weight: 500;
            border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
    nav a:hover { color: var(--text); }
    nav a.active { color: var(--accent); border-color: var(--accent); }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
    #nav-cpu { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); }

    /* ── Layout ── */
    .page { margin-top: var(--nav-h); padding: 24px; max-width: 1400px; margin-left: auto; margin-right: auto; }
    .page-header { margin-bottom: 20px; }
    .page-header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .page-header p { color: var(--text-dim); margin-top: 4px; font-size: 13px; }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px;
            transition: border-color .15s; }
    .card:hover { border-color: var(--border-hover); }
    .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase;
                  letter-spacing: .08em; color: var(--text-dim); margin-bottom: 12px; }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .grid-4, .grid-3 { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 600px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
             border-radius: 12px; font-size: 11px; font-weight: 600;
             font-family: 'JetBrains Mono', monospace; letter-spacing: .02em; }
    .badge-green  { background: rgba(34,197,94,0.12); color: var(--accent); border: 1px solid var(--accent-dim); }
    .badge-blue   { background: rgba(59,130,246,0.12); color: #93c5fd; border: 1px solid #1d4ed8; }
    .badge-amber  { background: rgba(245,158,11,0.12); color: #fcd34d; border: 1px solid #92400e; }
    .badge-red    { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid var(--danger-dim); }
    .badge-gray   { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
    .dot { width: 6px; height: 6px; border-radius: 50%; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
           border-radius: 6px; font-size: 13px; font-weight: 500;
           font-family: 'Outfit', sans-serif; border: 1px solid transparent;
           cursor: pointer; transition: all .15s; text-decoration: none; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary  { background: var(--accent); color: #052e16; font-weight: 600; }
    .btn-primary:hover { background: #16a34a; }
    .btn-success  { background: var(--accent); color: #052e16; font-weight: 600; }
    .btn-danger   { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-ghost    { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { border-color: var(--border-hover); background: var(--surface2); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; color: var(--text-dim); font-weight: 600;
         font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
         border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    /* ── Progress bar ── */
    .bar-track { background: var(--surface2); border-radius: 4px; height: 6px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 4px; transition: width .3s; }
    .bar-cpu   { background: var(--accent); }
    .bar-mem   { background: var(--blue); }
    .bar-disk  { background: var(--warning); }

    /* ── Inputs ── */
    input, select, textarea {
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 10px; font-size: 13px;
      font-family: 'Outfit', sans-serif;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
    }

    /* ── Misc ── */
    .text-muted { color: var(--text-dim); }
    .text-sm    { font-size: 12px; }
    .mono       { font-family: 'JetBrains Mono', 'Menlo', 'Consolas', monospace; font-size: 12px; }
    .flex       { display: flex; }
    .items-center { align-items: center; }
    .gap-8      { gap: 8px; }
    .gap-4      { gap: 4px; }
    .ml-auto    { margin-left: auto; }
    .mb-16      { margin-bottom: 16px; }
    .mb-8       { margin-bottom: 8px; }

    /* ── Scrollbar (webkit) ── */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a href="/" class="nav-brand">NDI Recorder</a>
  <a href="/" id="nav-dash" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
  <a href="/browse" id="nav-browse" class="{% if request.path.startswith('/browse') %}active{% endif %}">Browse</a>
  <a href="/storage" id="nav-storage" class="{% if request.path == '/storage' %}active{% endif %}">Storage</a>
  <a href="/settings" id="nav-settings" class="{% if request.path == '/settings' %}active{% endif %}">Settings</a>
  <div class="nav-right">
    <span id="nav-cpu" title="Total CPU">CPU —%</span>
    <span class="text-muted text-sm mono" title="App version">v{{ app_version }}</span>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script>
  // Global SocketIO connection for system stats
  const statsSocket = io('/stats');
  statsSocket.on('system_stats', data => {
    document.getElementById('nav-cpu').textContent = `CPU ${data.total_cpu.toFixed(0)}%`;
    if (window._onStats) window._onStats(data);
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
